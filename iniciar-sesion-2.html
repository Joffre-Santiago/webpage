<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdenConnect - Iniciar Sesión</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 40px;
    gap:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#2c5b7a;
}

.language{
    padding:8px 12px;
    border:1px solid #ddd;
    border-radius:4px;
}

.hero{
    position:relative;
    height:calc(100vh - 70px);

    background-image:url("agricultor.jpg");
    background-size:cover;
    background-position:center;
}

.login-container{
    position:absolute;
    top:50%;
    right:80px;
    transform:translateY(-50%);

    width:360px;

    background:white;
    padding:30px;

    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    color:#555;
}

input{
    width:100%;
    padding:12px 18px;

    border:1px solid #dcdcdc;
    border-radius:25px;

    outline:none;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    color:#666;
    font-size:14px;
}

.login-btn{
    width:100%;
    border:none;
    border-radius:25px;

    background:#1f4fff;
    color:white;

    padding:12px;

    cursor:pointer;
    font-weight:bold;
}

.links{
    display:flex;
    justify-content:space-between;

    margin-top:15px;
    font-size:13px;
}

.links a{
    text-decoration:none;
    color:#666;
}

.social{
    text-align:center;
    margin-top:25px;
}

.social p{
    margin-bottom:15px;
    color:#777;
}

.social-icons{
    display:flex;
    justify-content:center;
    gap:12px;
}

.icon{
    width:35px;
    height:35px;
    border-radius:4px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-weight:bold;
}

.facebook{
    background:#1877F2;
}

.google{
    background:#DB4437;
}

.linkedin{
    background:#0A66C2;
}

@media(max-width:768px){

    .login-container{
        right:20px;
        left:20px;
        width:auto;
    }

    header{
        padding:0 15px;
    }

    .logo{
        font-size:24px;
    }

}

</style>
</head>
<body>

<header>

    <div class="logo">
        EdenConnect.com
    </div>

    <select class="language">
        <option>Español</option>
        <option>English</option>
    </select>

</header>

<section class="hero">

    <div class="login-container">

        <form>

            <div class="form-group">
                <label>Correo</label>
                <input
                    type="email"
                    placeholder="tu correo">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input
                    type="password"
                    placeholder="tu clave">
            </div>

            <div class="remember">
                <input type="checkbox">
                <span>Permanecer registrado</span>
            </div>

            <button class="login-btn">
                Iniciar sesión
            </button>

            <div class="links">
                <a href="crear-empresa.html">Crear Empresa</a>
                <a href="crear-cuenta.html">Crear cuenta</a>
            </div>

            <div class="social">
                <p>Iniciar sesión con</p>

                <div class="social-icons">

                    <div class="icon facebook">
                        f
                    </div>

                    <div class="icon google">
                        G
                    </div>

                    <div class="icon linkedin">
                        in
                    </div>

                </div>
            </div>

        </form>

    </div>

</section>

</body>
</html>
