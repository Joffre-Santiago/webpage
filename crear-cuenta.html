<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EdenConnect - Crear Cuenta</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
}

header{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 40px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#315c78;
}

.language{
    margin-left:20px;
    padding:8px;
    border:1px solid #ddd;
}

.container{
    max-width:650px;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.form-row{
    display:grid;
    grid-template-columns:200px 1fr;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

label{
    font-size:14px;
    color:#444;
}

input,
select{
    width:100%;
    padding:10px 15px;
    border:1px solid #d8d8d8;
    border-radius:8px;
}

.radio-group{
    display:flex;
    gap:20px;
}

.radio-group label{
    display:flex;
    align-items:center;
    gap:5px;
}

.phone{
    display:flex;
    gap:10px;
}

.phone .code{
    width:90px;
}

.terms{
    margin-top:25px;
    font-size:13px;
    color:#666;
    line-height:1.5;
}

.terms label{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.btn-register{
    width:100%;
    margin-top:25px;
    padding:14px;

    border:none;
    border-radius:30px;

    background:#1d4fff;
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.btn-register:hover{
    opacity:.9;
}

.required{
    color:red;
}

@media(max-width:768px){

    .form-row{
        grid-template-columns:1fr;
    }

    .container{
        margin:20px;
        padding:25px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        EdenConnect.com
    </div>

    <select class="language">
        <option>Español</option>
        <option>English</option>
    </select>

</header>

<div class="container">

    <h2>Crear Cuenta</h2>

    <form>

        <div class="form-row">
            <label><span class="required">*</span> País / Región</label>

            <select>
                <option>Perú</option>
                <option>Chile</option>
                <option>Colombia</option>
            </select>
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Tipo de usuario</label>

            <div class="radio-group">
                <label><input type="radio" name="tipo"> Productor</label>
                <label><input type="radio" name="tipo"> Exportador</label>
                <label><input type="radio" name="tipo"> Comprador</label>
            </div>
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Correo electrónico</label>
            <input type="email">
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Contraseña</label>
            <input type="password">
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Confirmar contraseña</label>
            <input type="password">
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Nombre de empresa</label>
            <input type="text">
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Nombre completo</label>
            <input type="text">
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Teléfono</label>

            <div class="phone">
                <input class="code" placeholder="+51">
                <input placeholder="999999999">
            </div>
        </div>

        <div class="form-row">
            <label><span class="required">*</span> Verificación</label>
            <input type="text" placeholder="Ingrese código">
        </div>

        <div class="terms">
            <label>
                <input type="checkbox">

                <span>
                    Acepto el Acuerdo de membresía gratuita,
                    los Términos de uso y la Política de privacidad.
                    Asimismo acepto recibir información de
                    EdenConnect sobre sus productos y servicios.
                </span>
            </label>
        </div>

        <button class="btn-register">
            Aceptar y registrarse
        </button>

    </form>

</div>

</body>
</html>
